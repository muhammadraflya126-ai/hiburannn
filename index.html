
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Misi Rahasia Shaula 🤭</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#a18cd1);
    padding:20px;
}

.container{
    width:100%;
    max-width:550px;
    background:rgba(255,255,255,0.9);
    color:#333;
    padding:35px 25px;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

h1{
    font-size:28px;
}

#quiz{
    margin-top:25px;
}

.question{
    font-size:21px;
    font-weight:bold;
    margin-bottom:20px;
}

button{
    width:100%;
    padding:15px;
    margin:7px 0;
    border:none;
    border-radius:15px;
    font-size:16px;
    cursor:pointer;
    background:#ff7b9c;
    color:white;
    transition:0.2s;
}

button:hover{
    transform:scale(1.03);
}

.progress{
    width:100%;
    height:12px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
    margin:20px 0;
}

#bar{
    width:0%;
    height:100%;
    background:#ff7b9c;
    transition:0.4s;
}

.hidden{
    display:none;
}

.result{
    font-size:18px;
    line-height:1.7;
}

.big{
    font-size:25px;
}

</style>
</head>

<body>

<div class="container">

    <h1>🕵️ MISI RAHASIA SHAULA 🤭</h1>

    <p>
        selamat datang, <b>Shaula Putri Rachma</b> 😌<br>
        kamu telah dipilih untuk mengikuti misi yang sangat penting...
    </p>

    <p>
        <b>Catatan:</b> tidak ada hadiah, tapi semoga bisa bikin senyum secuilll haha😂
    </p>

    <div class="progress">
        <div id="bar"></div>
    </div>

    <div id="quiz"></div>

</div>


<script>

let step = 0;


/* =========================
   DATA PERTANYAAN
========================= */

const questions = [

{
q:"🦸 Kalau Shaula punya kekuatan super hari ini, pilih yang mana?",
a:[
"Bisa tidur kapan aja 😭",
"Bisa teleport ke tempat makan 🍜",
"Bisa menghilangkan tugas kuliah 🫠"
]
},

{
q:"🍜 Kalau dikasih makanan gratis seumur hidup, pilih apa?",
a:[
"Seblak 🌶️",
"Mie ayam 🍜",
"SEMUA JUGA MAU 😭"
]
},

{
q:"🤨 Level kegabutan Shaula hari ini berapa?",
a:[
"Masih aman 😌",
"Gabut dikit 😑",
"Gabut banget 😭",
"Sudah butuh pertolongan 😂"
]
},

{
q:"🐱 Kalau tiba-tiba jadi hewan sehari, mau jadi apa?",
a:[
"Kucing, kerjaannya tidur 😭",
"Burung, biar bisa terbang",
"Hamster, lucu 😌"
]
},

{
q:"🎁 Kalau tiba-tiba dapat uang 10 juta, yang pertama dilakukan?",
a:[
"Makan enak 🍔",
"Belanja 😭",
"Ditabung dulu lah 😎",
"Masih mikir 🤔"
]
},

{
q:"😂 Pilih salah satu yang paling menggambarkan Shaula:",
a:[
"Aku lucu tapi orang lain belum sadar 😌",
"Aku normal kok... kayaknya 😭",
"Aku cuma butuh makanan",
"Aku butuh liburan"
]
}

];


/* =========================
   TAMPILKAN PERTANYAAN
========================= */

function showQuestion(){

    if(step >= questions.length){
        showResult();
        return;
    }

    let q = questions[step];

    let html = `
        <div class="question">
            ${q.q}
        </div>
    `;

    q.a.forEach(answer => {

        html += `
        <button onclick="nextQuestion()">
            ${answer}
        </button>
        `;

    });

    document.getElementById("quiz").innerHTML = html;

    updateProgress();

}


/* =========================
   LANJUT
========================= */

function nextQuestion(){

    step++;

    showQuestion();

}


/* =========================
   PROGRESS
========================= */

function updateProgress(){

    let percent = (step / questions.length) * 100;

    document.getElementById("bar").style.width =
    percent + "%";

}


/* =========================
   HASIL
========================= */

function showResult(){

    document.getElementById("bar").style.width = "100%";

    document.getElementById("quiz").innerHTML = `

    <div class="result">

        <div class="big">🧐 HASIL ANALISIS SISTEM</div>

        <br>

        Setelah melakukan penelitian yang
        <b>sangat tidak penting</b> selama beberapa detik... 😭

        <br><br>

        Sistem menemukan sesuatu yang mengejutkan.

        <br><br>

        <b class="big">
        SHAULA TERDETEKSI SEBAGAI MANUSIA
        YANG WAJIB SENYUM HARI INI 🤨😂
        </b>

        <br><br>

        Hukuman hari ini adalah...

        <br>

        <b>COBA SENYUM SEKARANG 😭</b>

        <br><br>

        Iya kamu.

        <br>

        Yang lagi baca ini.

        <br>

        Jangan pura-pura nggak baca 🤨😂

        <br><br>

        <button onclick="belumSenyum()">
        😑 Aku belum senyum
        </button>

    </div>

    `;

}


/* =========================
   BELUM SENYUM
========================= */

function belumSenyum(){

    document.getElementById("quiz").innerHTML = `

    <div class="result">

        <div class="big">🚨 SISTEM MENDETEKSI KEBOHONGAN 🚨</div>

        <br>

        MASA IYA BELUM SENYUM SAMA SEKALI 😭😂

        <br><br>

        Minimal tadi sudut bibirnya
        naik dikit kan? 🤨

        <br><br>

        <button onclick="pesanRahasia()">
        😭 Sekali lagi deh
        </button>

    </div>

    `;

}


/* =========================
   PESAN RAHASIA
========================= */

function pesanRahasia(){

    document.getElementById("quiz").innerHTML = `

    <div class="result">

        <div class="big">🤍 PESAN RAHASIA UNTUK SHAULA 🤍</div>

        <br>

        Hari ini mungkin nggak selalu gampang.

        <br><br>

        Tapi semoga game kecil ini
        minimal bisa bikin kamu
        senyum sedikit 😄

        <br><br>

        Kalau sekarang belum bisa
        bahagia banget juga nggak apa-apa.

        <br><br>

        Pelan-pelan aja.

        <br><br>

        Nggak harus selalu kuat.
        Nggak harus selalu pura-pura baik-baik aja.

        <br><br>

        Yang penting jangan lupa...

        <br><br>

        <b class="big">
        KAMU ITU BERHARGA 🤍
        </b>

        <br><br>

        Dan ada orang yang peduli sama kamu.

        <br><br>

        Jadi hari ini...

        <br>

        <b>SENYUM DIKIT BOLEH LAH 😭😂🤍</b>

        <br><br>

        <button onclick="ulang()">
        🔄 Main Lagi
        </button>

    </div>

    `;

}


/* =========================
   ULANG
========================= */

function ulang(){

    step = 0;

    showQuestion();

}


/* START */

showQuestion();

</script>

</body>
</html>
```
